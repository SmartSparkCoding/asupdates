<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="topbar">
    <h2>AS Updates Dashboard</h2>
    <a href="/logout">Logout</a>
</div>

<div class="grid">

    <div class="card">
        <h3>Today's Timetable</h3>
        <p>Your lessons are shown in your daily email.</p>
    </div>

    <div class="card">
        <h3>Email Settings</h3>

        <form method="POST" action="/toggle-emails">
            <button>Toggle Emails</button>
        </form>

    </div>

    <div class="card">
        <h3>Account</h3>
        <p>Email: {{ email }}</p>
    </div>

</div>

</body>
</html>
