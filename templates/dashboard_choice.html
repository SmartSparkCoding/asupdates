<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Dashboard - Ashford School Updates</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Feedback Banner -->
    <div class="feedback-banner">
        <a href="https://hackanomous-rsvp.fillout.com/t/kYWQReDmZkus" target="_blank" class="feedback-btn">💬 Give feedback here</a>
    </div>

    <div class="container login-container">
        <div class="form-card choice-card">
            <div class="card-header">
                <h1>🎯 Choose Dashboard</h1>
                <p class="subtitle">Select which dashboard you'd like to access</p>
            </div>

            {% if get_flashed_messages() %}
                {% for category, message in get_flashed_messages(with_categories=true) %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="choice-info">
                <p>👤 <strong>{{ email }}</strong></p>
                <p style="color: #666; margin-top: 8px;">You have access to both dashboards.</p>
            </div>

            <div class="choice-buttons">
                <form method="POST" action="/dashboard/choice/admin" style="flex: 1;">
                    <button type="submit" class="btn btn-admin btn-large choice-button">
                        <span style="font-size: 1.5rem; margin-bottom: 6px;">🔧</span>
                        Admin Dashboard
                        <span style="font-size: 0.85rem; display: block; margin-top: 4px; opacity: 0.9;">Manage users, notices, schedule</span>
                    </button>
                </form>

                <form method="POST" action="/dashboard/choice/normal" style="flex: 1;">
                    <button type="submit" class="btn btn-primary btn-large choice-button">
                        <span style="font-size: 1.5rem; margin-bottom: 6px;">📊</span>
                        User Dashboard
                        <span style="font-size: 0.85rem; display: block; margin-top: 4px; opacity: 0.9;">View schedule, timetable, settings</span>
                    </button>
                </form>
            </div>

            <p class="form-footer">
                <a href="/logout">Logout instead</a>
            </p>
        </div>
    </div>

    <style>
        .choice-card {
            max-width: 600px;
        }

        .choice-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #14b8a6;
        }

        .choice-info p {
            margin: 0;
        }

        .choice-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .choice-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px !important;
            height: 100%;
            min-height: 140px;
        }

        @media (max-width: 600px) {
            .choice-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
