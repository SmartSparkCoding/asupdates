<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AS Updates - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Login</h1>

        <form method="POST">
            <input type="email" name="email" placeholder="School Email" required>
            <input type="password" name="pin" placeholder="PIN (if set)">
            <button type="submit">Login</button>
        </form>

        <p class="small">
            No account? <a href="/signup">Sign up</a>
        </p>
    </div>
</div>

</body>
</html>
