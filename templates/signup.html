<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AS Updates - Sign Up</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Sign Up</h1>

        <form method="POST">
            <input type="email" name="email" placeholder="School Email" required>
            <input type="password" name="pin" placeholder="Set a PIN (optional)">
            <button type="submit">Create Account</button>
        </form>

        <p class="small">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>
</div>

</body>
</html>
